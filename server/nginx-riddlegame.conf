# Sleeping Clock Room escape game. Certbot adds the HTTPS listener and the HTTP redirect to this file.
server {
    server_name riddle.pythonpath.ir;
    root /var/www/riddlegame;
    index index.html;
    add_header Cache-Control "no-cache";
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }

    location = /api/scores {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:51860;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/riddle.pythonpath.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/riddle.pythonpath.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = riddle.pythonpath.ir) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name riddle.pythonpath.ir;
    return 404; # managed by Certbot


}